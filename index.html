<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda - Lore & Juli</title>
    
    <style>
        /* ==========================================================================
           1. PALETA DE COLORES (TEAL PREMIUM & MARFIL)
           ========================================================================== */
        :root {
            --color-teal: #005A5B;           /* Teal elegante principal */
            --color-teal-oscuro: #004445;    /* Sombra interna y trasera del sobre */
            --color-interior: #E5E1D5;       /* Interior crema / beige del sobre */
            --color-marfil: #FDFCF7;         /* Color de las tarjetas */
            --color-texto: #2C3E42;          /* Gris oscuro cálido */
            --color-texto-suave: #607D81;    /* Gris atenuado */
            --color-dorado: #C29E53;         /* Sello de cera */
            --fondo-lino: #F2EDE4;           /* Fondo general simulando tela beige */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--fondo-lino);
            background-image: radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
            background-size: 8px 8px;
            color: var(--color-texto);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1200px; /* Perspectiva global necesaria para el efecto 3D */
        }

        .escenario-invitacion {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 85vh;
            max-height: 680px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================================================
           2. TARJETA DELANTE DEL SOBRE
           ========================================================================== */
        .tarjeta-frontal {
            position: absolute;
            width: 86%;
            height: 72%;
            background: var(--color-marfil);
            padding: 35px 24px;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            z-index: 100; /* Siempre al frente al inicio */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.03);
            transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.6s ease;
        }

        .titulo-boda {
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--color-texto-suave);
        }

        /* Monograma Ovalado Elegante */
        .monograma-oval {
            width: 75px;
            height: 105px;
            border: 1px solid #DED9CE;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -2px;
            color: var(--color-texto);
            margin: 10px 0;
            position: relative;
        }
        .monograma-oval span {
            font-size: 1.3rem;
            color: var(--color-texto-suave);
            margin-left: 1px;
        }

        .bloque-invitado {
            width: 100%;
        }
        .texto-reserva {
            font-family: sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-texto-suave);
            margin-bottom: 6px;
        }
        .nombre-familia {
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 4px;
        }
        .pases-cantidad {
            font-family: sans-serif;
            font-size: 0.75rem;
            color: var(--color-texto-suave);
        }

        .btn-abrir {
            width: 100%;
            background: transparent;
            border: 1px solid #C5BEB1;
            padding: 13px;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
        }
        .btn-abrir:hover, .btn-abrir:active {
            background: var(--color-texto);
            color: #FFFFFF;
            border-color: var(--color-texto);
        }

        /* ==========================================================================
           3. ESTRUCTURA INTERACTIVA DEL SOBRE
           ========================================================================== */
        .sobre-capsula {
            position: relative;
            width: 90%;
            height: 56%;
            transform-style: preserve-3d;
        }

        /* Base trasera del sobre */
        .sobre-base-trasera {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--color-teal-oscuro);
            border-radius: 4px;
            z-index: 1;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        /* Solapa Superior (Giro 3D realista) */
        .sobre-solapa {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 50%;
            background-color: var(--color-teal);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
            transform-origin: top center;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), z-index 0.1s 0.45s;
            z-index: 5;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,0.15));
        }

        /* Forro beige expuesto al girar la solapa */
        .sobre-solapa::before {
            content: '';
            position: absolute;
            top: 4px; left: 6px; right: 6px; bottom: 6px;
            background: var(--color-interior);
            clip-path: polygon(0 0, 50% 100%, 100% 0);
        }

        /* Sello de lacre */
        .sello-cera {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #EAD19B 0%, var(--color-dorado) 100%);
            border-radius: 50%;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2), inset 0 1px 2px rgba(255,255,255,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #554117;
            font-weight: bold;
            letter-spacing: 1px;
            transition: opacity 0.4s, transform 0.4s;
        }

        /* Cuerpo frontal recortado del sobre */
        .sobre-frente {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 4; /* Permite la salida de la tarjeta entre la base y el frente */
            pointer-events: none;
        }
        .sobre-frente::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-teal);
            clip-path: polygon(0 0, 0% 100%, 100% 100%, 50% 50%);
        }
        .sobre-frente::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--color-teal-oscuro);
            clip-path: polygon(0 100%, 50% 48%, 100% 100%);
            opacity: 0.25;
        }

        /* ==========================================================================
           4. TARJETA INTERIOR (INVITACIÓN COMPLETA)
           ========================================================================== */
        .tarjeta-interior {
            position: absolute;
            bottom: 4%; left: 4%;
            width: 92%; height: 92%;
            background: var(--color-marfil);
            z-index: 2; /* Resguardada dentro del sobre */
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), z-index 0.1s 0.5s;
        }

        .nombres-novios {
            font-size: 1.9rem;
            font-weight: 300;
            color: var(--color-teal-oscuro);
            margin: 5px 0;
            letter-spacing: 1px;
        }

        .texto-honor {
            font-size: 0.95rem;
            font-style: italic;
            color: var(--color-texto-suave);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .bloque-dato {
            margin-bottom: 8px;
        }
        .dato-titulo {
            font-family: sans-serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--color-texto-suave);
        }
        .dato-valor {
            font-size: 1.15rem;
            color: var(--color-texto);
            margin-top: 1px;
        }

        /* ==========================================================================
           5. ESTADOS Y CLASES DE ANIMACIÓN
           ========================================================================== */
        
        /* Desvanecimiento de la tarjeta frontal */
        .anim-ocultar-frontal {
            transform: translateY(-40px);
            opacity: 0;
            pointer-events: none;
        }

        /* Apertura 3D de la solapa */
        .anim-abrir-solapa {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .anim-ocultar-sello {
            opacity: 0;
            transform: translate(-50%, -130%) scale(0.6);
        }

        /* Elevación y centrado de la invitación final */
        .anim-extraer-tarjeta {
            transform: translateY(-66%) scale(1.03);
            z-index: 200;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        /* Controles multimedia flotantes */
        .panel-controles {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .btn-flotante {
            width: 44px;
            height: 44px;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            font-size: 0.95rem;
            color: var(--color-texto);
            transition: transform 0.2s;
        }
        .btn-flotante:active { transform: scale(0.95); }

        @media (prefers-reduced-motion: reduce) {
            .tarjeta-frontal, .sobre-solapa, .tarjeta-interior, .sello-cera {
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <audio id="audioBoda" loop src="https://docs.google.com/uc?export=download&id=1xkem7zhA0DQPEdz5gSJDbYaxtuSJctUC"></audio>

    <div class="escenario-invitacion">

        <div class="tarjeta-frontal" id="moduloFrontal">
            <p class="titulo-boda">Nuestra Boda</p>
            <div class="monograma-oval">L<span>J</span></div>
            <div class="bloque-invitado">
                <p class="texto-reserva">Invitación reservada para</p>
                <h3 class="nombre-familia" id="lblFamilia">...</h3>
                <p class="pases-cantidad" id="lblPases">...</p>
            </div>
            <button class="btn-abrir" id="btnDisparar" onclick="secuenciaCinematografica()">Abrir invitación</button>
        </div>

        <div class="sobre-capsula">
            
            <div class="sobre-base-trasera"></div>

            <div class="tarjeta-interior" id="moduloInterior">
                <p class="titulo-boda">Nuestra Boda</p>
                
                <div>
                    <h2 class="nombres-novios" id="lblNovios">... & ...</h2>
                    <p class="texto-honor">Tenemos el honor de invitarte a celebrar nuestra boda.</p>
                    
                    <div class="bloque-dato">
                        <p class="dato-titulo">Fecha</p>
                        <p class="dato-valor" id="lblFecha">...</p>
                    </div>
                    <div class="bloque-dato">
                        <p class="dato-titulo">Hora</p>
                        <p class="dato-valor" id="lblHora">...</p>
                    </div>
                    <div class="bloque-dato">
                        <p class="dato-titulo">Lugar</p>
                        <p class="dato-valor" id="lblLugar">...</p>
                    </div>
                </div>

                <div class="monograma-oval" style="transform: scale(0.65); margin: 0;">L<span>J</span></div>
            </div>

            <div class="sobre-frente"></div>

            <div class="sobre-solapa" id="moduloSolapa">
                <div class="sello-cera" id="moduloSello">LJ</div>
            </div>

        </div>
    </div>

    <div class="panel-controles">
        <button class="btn-flotante" onclick="mutarMusica()" title="Música">🎵</button>
        <button class="btn-flotante" id="btnCerrar" onclick="secuenciaInversa()" style="display: none;" title="Cerrar sobre">🔄</button>
    </div>

    <script>
        // CONFIGURACIÓN CENTRALIZADA DE LOS DATOS
        const invitationData = {
            groom: "Lore",
            bride: "Juli",
            family: "Familia Martínez",
            guests: "2 personas",
            date: "15 de noviembre de 2026",
            time: "6:00 PM",
            venue: "Lugar de celebración"
        };

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('lblFamilia').innerText = invitationData.family;
            document.getElementById('lblPases').innerText = invitationData.guests;
            document.getElementById('lblNovios').innerText = `${invitationData.groom} & ${invitationData.bride}`;
            document.getElementById('lblFecha').innerText = invitationData.date;
            document.getElementById('lblHora').innerText = invitationData.time;
            document.getElementById('lblLugar').innerText = invitationData.venue;
        });

        const cancion = document.getElementById('audioBoda');

        // FLUJO SECUENCIAL CRONOMETRADO
        function secuenciaCinematografica() {
            document.getElementById('btnDisparar').disabled = true;

            // 0.2s - Desvanecer tarjeta delantera
            setTimeout(() => {
                document.getElementById('moduloFrontal').classList.add('anim-ocultar-frontal');
            }, 200);

            // 0.8s - Rotación 3D de la solapa y ocultar sello de cera
            setTimeout(() => {
                document.getElementById('moduloSolapa').classList.add('anim-abrir-solapa');
                document.getElementById('moduloSello').classList.add('anim-ocultar-sello');
                cancion.play().catch(() => console.log("Permisos de audio pendientes."));
            }, 800);

            // 2.0s - Elevación tridimensional de la invitación real desde el sobre
            setTimeout(() => {
                document.getElementById('moduloInterior').classList.add('anim-extraer-tarjeta');
            }, 2000);

            // 3.5s - Mostrar botón opcional para revertir
            setTimeout(() => {
                document.getElementById('btnCerrar').style.display = "flex";
            }, 3500);
        }

        function secuenciaInversa() {
            document.getElementById('btnCerrar').style.display = "none";
            document.getElementById('moduloInterior').classList.remove('anim-extraer-tarjeta');
            
            setTimeout(() => {
                document.getElementById('moduloSolapa').classList.remove('anim-abrir-solapa');
                document.getElementById('moduloSello').classList.remove('anim-ocultar-sello');
            }, 1000);

            setTimeout(() => {
                document.getElementById('moduloFrontal').classList.remove('anim-ocultar-frontal');
                document.getElementById('btnDisparar').disabled = false;
            }, 1800);
        }

        function mutarMusica() {
            if (cancion.paused) cancion.play();
            else cancion.pause();
        }
    </script>
</body>
</html>
