<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda - Lore & Juli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --verde-sobre: #7A8F75;
            --verde-sobre-oscuro: #657761;
            --crema-fondo: #E6DFD3;
            --texto-oscuro: #4A4A4A;
            --texto-secundario: #7E7E7E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--crema-fondo);
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            color: var(--texto-oscuro);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .contenedor-movil {
            width: 100%;
            max-width: 430px;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #FAF8F5;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
            min-height: 100vh;
        }

        /* --- CONTENEDOR DE LA PANTALLA DEL SOBRE --- */
        .pantalla-sobre {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background-color: var(--crema-fondo);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s;
        }

        /* Estructura del sobre con posición absoluta interna controlada */
        .sobre-contenedor {
            position: relative;
            width: 360px;
            height: 480px;
        }

        /* Tarjeta blanca interior (empieza guardada abajo) */
        .tarjeta-interior {
            position: absolute;
            bottom: 10px;
            left: 20px;
            width: 320px;
            height: 400px;
            background: #FFFFFF;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            z-index: 2;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
        }

        /* Monograma Ovalado Rectificado */
        .monograma-marco {
            width: 80px;
            height: 120px;
            border: 1px solid #C0C0C0;
            border-radius: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        .monograma-marco::before {
            content: '🌿';
            position: absolute;
            top: -8px;
            font-size: 0.8rem;
        }

        .monograma-marco::after {
            content: '🌿';
            position: absolute;
            bottom: -8px;
            font-size: 0.8rem;
            transform: rotate(180deg);
        }

        .monograma-texto {
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: -2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .monograma-texto span {
            font-size: 1.3rem;
            color: var(--texto-secundario);
            margin: 0 2px;
            position: relative;
            top: 5px;
        }

        .encabezado-tarjeta {
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--texto-secundario);
        }

        .sub-tarjeta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--texto-secundario);
            margin-bottom: 5px;
        }

        .invitado-nombre {
            font-size: 1.5rem;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .invitado-pases {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            color: var(--texto-secundario);
        }

        .btn-abrir-invitacion {
            width: 100%;
            background: transparent;
            border: 1px solid #D1D1D1;
            padding: 10px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
        }

        /* Cuerpo principal del sobre (Frente) */
        .sobre-frontal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 360px;
            height: 250px;
            background-color: var(--verde-sobre);
            z-index: 4;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* Recortes diagonales imitando las solapas plegadas */
        .sobre-frontal::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            border-left: 180px solid var(--verde-sobre-oscuro);
            border-top: 250px solid transparent;
            z-index: 4;
            border-radius: 0 0 0 8px;
        }

        .sobre-frontal::after {
            content: '';
            position: absolute;
            bottom: 0; right: 0;
            border-right: 180px solid var(--verde-sobre-oscuro);
            border-top: 250px solid transparent;
            z-index: 4;
            border-radius: 0 0 8px 0;
        }

        /* Solapa superior triangular */
        .sobre-solapa {
            position: absolute;
            top: 230px; /* Alineada exactamente arriba del frente */
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 130px solid var(--verde-sobre);
            transform-origin: top center;
            transition: transform 0.5s ease-in-out, z-index 0.1s 0.2s;
            z-index: 5;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.1));
        }

        /* Sello de lacre */
        .sello-lacre {
            position: absolute;
            top: 210px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 50px;
            background: radial-gradient(circle, #E3C17E 0%, #C29E53 100%);
            border-radius: 50%;
            cursor: pointer;
            z-index: 6;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: transform 0.4s, opacity 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sello-lacre::after {
            content: '⚜️';
            font-size: 1rem;
            opacity: 0.6;
            color: #7A5F23;
        }

        /* --- CLASES DE CONTROL DE ANIMACIÓN --- */
        .sobre-contenedor.abierto .sobre-solapa {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .sobre-contenedor.abierto .sello-lacre {
            transform: translate(-50%, -20px) scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .sobre-contenedor.abierto .tarjeta-interior {
            transform: translateY(-160px);
            z-index: 10;
        }

        .pantalla-sobre.oculta {
            transform: translateX(-50%) translateY(-100vh);
            opacity: 0;
            pointer-events: none;
        }

        /* --- CONTENIDO INVITACIÓN COMPLETA (POST-APERTURA) --- */
        .contenido-principal {
            width: 100%;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .seccion-hero {
            text-align: center;
            width: 100%;
            margin-bottom: 40px;
        }

        .foto-boda {
            width: 100%;
            height: 450px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin: 25px 0 10px 0;
            text-align: center;
        }

        .frase-amor {
            font-size: 1.15rem;
            font-style: italic;
            color: var(--texto-secundario);
            line-height: 1.6;
            padding: 0 15px;
            text-align: center;
        }

        /* CONTROLES MULTIMEDIA FLOTANTES */
        .boton-musica {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 45px;
            height: 45px;
            background: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 2000;
            color: var(--texto-oscuro);
        }
    </style>
</head>
<body>

    <audio id="musicaBoda" loop src="https://docs.google.com/uc?export=download&id=1xkem7zhA0DQPEdz5gSJDbYaxtuSJctUC"></audio>
    
    <div class="boton-musica" onclick="alternarMusica()">
        <i id="iconoMusica" class="fas fa-music"></i>
    </div>

    <div class="contenedor-movil">

        <div class="pantalla-sobre" id="pantallaSobre">
            <div class="sobre-contenedor" id="sobreContenedor">
                
                <div class="tarjeta-interior">
                    <p class="encabezado-tarjeta">Nuestra Boda</p>
                    
                    <div class="monograma-marco">
                        <div class="monograma-texto">L<span>J</span></div>
                    </div>

                    <div style="width: 100%;">
                        <p class="sub-tarjeta">Invitación exclusiva para:</p>
                        <h3 class="invitado-nombre" id="nombreInvitado">Familia Martínez</h3>
                        <p class="invitado-pases" id="pasesInvitado">2 pases</p>
                    </div>

                    <button class="btn-abrir-invitacion" onclick="entrarInvitacion()">Abrir Invitación</button>
                </div>

                <div class="sobre-frontal"></div>

                <div class="sobre-solapa"></div>

                <div class="sello-lacre" onclick="abrirSolapa()"></div>

            </div>
        </div>

        <div class="contenido-principal">
            <div class="seccion-hero">
                <img src="http://googleusercontent.com/profile/picture/3" class="foto-boda" alt="Lore y Juli">
                <h1>LORE & JULI</h1>
                <p class="frase-amor">"A veces lo que empieza como una locura, se convierte en lo mejor de tu vida."</p>
            </div>
            
            </div>

    </div>

    <script>
        // Lectura automatizada de pases desde la URL (?n=Nombre&p=2)
        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.get('n')) document.getElementById('nombreInvitado').innerText = urlParams.get('n');
        if(urlParams.get('p')) document.getElementById('pasesInvitado').innerText = urlParams.get('p') + " personas";

        const sobreContenedor = document.getElementById('sobreContenedor');
        const pantallaSobre = document.getElementById('pantallaSobre');
        const audio = document.getElementById('musicaBoda');
        const icono = document.getElementById('iconoMusica');

        // Paso 1: Abre el sobre y sube la tarjeta
        function abrirSolapa() {
            sobreContenedor.classList.add('abierto');
            // Intenta reproducir la melodía de fondo automáticamente al primer toque
            audio.play().then(() => {
                icono.className = "fas fa-pause";
            }).catch(() => console.log("Interacción requerida para audio."));
        }

        // Paso 2: Desplaza toda la pantalla del sobre hacia arriba y muestra el fondo
        function entrarInvitacion() {
            pantallaSobre.classList.add('oculta');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Control del botón de reproducción manual lateral
        function alternarMusica() {
            if (audio.paused) {
                audio.play();
                icono.className = "fas fa-pause";
            } else {
                audio.pause();
                icono.className = "fas fa-music";
            }
        }
    </script>
</body>
</html>
