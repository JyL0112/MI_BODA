<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda - Lore & Juli</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ==========================================================================
           1. VARIABLES DE DISEÑO (PALETA TEAL Y CONFIGURACIÓN)
           ========================================================================== */
        :root {
            --teal-sobre: #005A5B;          /* Color principal del sobre exterior */
            --teal-sobre-oscuro: #004445;   /* Sombra interna del sobre */
            --crema-papel: #FDFBF7;         /* Color marfil / crema de las tarjetas */
            --fondo-lino: #F4F1EA;          /* Fondo simulador de lino/tela */
            --texto-principal: #2C3E42;     /* Gris oscuro para textos principales */
            --texto-secundario: #607D81;    /* Gris cálido atenuado */
            --dorado-lacre: #C29E53;        /* Acabado metálico artesanal */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--fondo-lino);
            /* Simulación de textura sutil de tela */
            background-image: radial-gradient(rgba(0,0,0,0.02) 1px, transparent 0);
            background-size: 8px 8px;
            color: var(--texto-principal);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            perspective: 1200px; /* Perspectiva global indispensable para el 3D */
        }

        /* Contenedor principal responsive (Enfoque Mobile First) */
        .escenario-invitacion {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 90vh;
            max-height: 740px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ==========================================================================
           2. COMPONENTE: TARJETA DELANTE DEL SOBRE (ESTÁTICA INICIAL)
           ========================================================================== */
        .tarjeta-frontal {
            position: absolute;
            width: 85%;
            height: 72%;
            background: var(--crema-papel);
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            z-index: 100; /* Por encima de todo al inicio */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            transition: transform 0.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 0.6s ease;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .encabezado-boda {
            font-size: 0.95rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--texto-secundario);
        }

        /* Monograma Ovalado Premium */
        .monograma-marco {
            width: 75px;
            height: 110px;
            border: 1px solid #D1C7BD;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
            position: relative;
        }
        .monograma-marco::before { content: '🌿'; position: absolute; top: -8px; font-size: 0.75rem; }
        .monograma-marco::after { content: '🌿'; position: absolute; bottom: -8px; font-size: 0.75rem; transform: rotate(180deg); }

        .monograma-letras {
            font-size: 2.3rem;
            font-weight: 300;
            letter-spacing: -2px;
        }
        .monograma-letras span {
            font-size: 1.3rem;
            color: var(--texto-secundario);
            margin: 0 1px;
        }

        .seccion-invitado {
            width: 100%;
        }
        .texto-reserva {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--texto-secundario);
            margin-bottom: 5px;
        }
        .nombre-familia {
            font-size: 1.7rem;
            font-weight: 400;
            color: var(--texto-principal);
            margin-bottom: 3px;
        }
        .pases-cantidad {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--teal-sobre);
        }

        .btn-accion {
            width: 100%;
            background: transparent;
            border: 1px solid #C5BBAE;
            padding: 14px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            border-radius: 2px;
        }
        .btn-accion:hover {
            background: var(--texto-principal);
            color: #FFFFFF;
            border-color: var(--texto-principal);
        }

        /* ==========================================================================
           3. COMPONENTE: ESTRUCTURA MECÁNICA DEL SOBRE (MECANISMO 3D)
           ========================================================================== */
        .sobre-contenedor {
            position: relative;
            width: 90%;
            height: 60%;
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }

        /* Pared Trasera (Interior del sobre) */
        .sobre-fondo-interior {
            position: absolute;
            width: 100%;
