<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda - Rebeca & Pablo</title>
    
    <!-- Fuentes elegantes e importación de iconos -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --verde-sobre: #7A8F75;
            --verde-sobre-oscuro: #657761;
            --crema-fondo: #E6DFD3;
            --texto-oscuro: #4A4A4A;
            --texto-secundario: #7E7E7E;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--crema-fondo);
            /* Fondo texturizado simulando el lino del video original */
            background-image: radial-gradient(rgba(0,0,0,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            color: var(--texto-oscuro);
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .contenedor-movil {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            background: #FAF8F5;
            box-shadow: 0 0 30px rgba(0,0,0,0.08);
        }

        /* --- CONTENEDOR DE LA ANIMACIÓN DEL SOBRE --- */
        .seccion-sobre {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 430px;
            height: 100%;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
            overflow: hidden;
        }

        /* El contenedor estructural del sobre */
        .sobre-wrapper {
            position: relative;
            width: 90%;
            height: 580px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cuerpo inferior y laterales del sobre */
        .sobre-cuerpo {
            position: absolute;
            bottom: 40px;
            width: 100%;
            height: 240px;
            background-color: var(--verde-sobre);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            z-index: 4;
        }

        /* Efecto de solapas laterales internas cortadas en diagonal */
        .sobre-cuerpo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 0; height: 0;
            border-left: 195px solid var(--verde-sobre-oscuro);
            border-top: 120px solid transparent;
            border-bottom: 120px solid var(--verde-sobre-oscuro);
            border-radius: 0 0 0 8px;
        }

        .sobre-cuerpo::after {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 0; height: 0;
            border-right: 195px solid var(--verde-sobre-oscuro);
            border-top: 120px solid transparent;
            border-bottom: 120px solid var(--verde-sobre-oscuro);
            border-radius: 0 0 8px 0;
        }

        /* Solapa triangular superior */
        .sobre-solapa {
            position: absolute;
            top: 260px;
            left: 0;
            width: 0;
            height: 0;
            border-left: 193px solid transparent;
            border-right: 193px solid transparent;
            border-top: 135px solid var(--verde-sobre);
            transform-origin: top center;
            transition: transform 0.6s ease-in-out, z-index 0.2s 0.4s;
            z-index: 5;
            filter: drop-shadow(0 4px 5px rgba(0,0,0,0.1));
        }

        /* SELLO DE LACRE / CERA */
        .sello {
            position: absolute;
            top: 360px;
            left: 50%;
            transform: translateX(-50%);
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, #E3C17E 0%, #C29E53 100%);
            border-radius: 50%;
            cursor: pointer;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.4);
            transition: transform 0.4s, opacity 0.4s 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sello::after {
            content: '⚜️';
            font-size: 1.2rem;
            opacity: 0.7;
            color: #7A5F23;
        }

        /* --- TARJETA BLANCA QUE SALE DEL SOBRE --- */
        .tarjeta-interior {
            position: absolute;
            bottom: 45px;
            width: 84%;
            height: 480px;
            background: #FFFFFF;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            z-index: 3;
            transition: transform 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* LOGO MONOGRAMA IDENTICO AL VIDEO */
        .monograma-marco {
            width: 70px;
            height: 110px;
            border: 1px solid var(--texto-secundario);
            border-radius: 50px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }

        /* Hojas decorativas del marco (simuladas con pseudo-elementos) */
        .monograma-marco::before, .monograma-marco::after {
            content: '🌿';
            position: absolute;
            font-size: 0.7rem;
            color: var(--verde-sobre);
        }
        .monograma-marco::before { top: -5px; left: 15px; transform: rotate(-30deg); }
        .monograma-marco::after { bottom: -5px; right: 15px; transform: rotate(150deg); }

        .monograma-texto {
            font-size: 2.2rem;
            font-weight: 300;
            letter-spacing: -2px;
            line-height: 1;
            font-family: 'Cormorant Garamond', serif;
        }

        .monograma-texto span {
            font-size: 1.4rem;
            position: relative;
            top: 10px;
            font-weight: 400;
            color: var(--texto-secundario);
        }

        .encabezado-tarjeta {
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--texto-secundario);
        }

        .sub-tarjeta {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--texto-secundario);
            margin-top: 15px;
            border-top: 1px solid #EAEAEA;
            padding-top: 15px;
            width: 80%;
        }

        .invitado-nombre {
            font-size: 1.6rem;
            font-weight: 400;
            margin: 5px 0;
        }

        .invitado-pases {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            color: var(--texto-oscuro);
        }

        .btn-abrir-invitacion {
            width: 100%;
            background: transparent;
            border: 1px solid #CCCCCC;
            padding: 12px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.05rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
        }

        .btn-abrir-invitacion:hover {
            background: #F9F9F9;
            border-color: #888888;
        }

        /* --- ESTADOS DE LA ANIMACIÓN (DISPARADOS POR JS) --- */
        .sobre-wrapper.abierto .sobre-solapa {
            transform: rotateX(180deg);
            z-index: 2;
        }

        .sobre-wrapper.abierto .sello {
            transform: translate(-50%, 80px) scale(0);
            opacity: 0;
        }

        .sobre-wrapper.abierto .tarjeta-interior {
            transform: translateY(-250px);
            z-index: 6;
        }

        .seccion-sobre.desvanecido {
            transform: translateX(-50%) translateY(-100vh);
        }

        /* --- CUERPO PRINCIPAL DE LA WEB (POST-APERTURA) --- */
        .contenido-principal {
            padding: 40px 25px;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .seccion {
            text-align: center;
            margin-bottom: 60px;
        }

        .foto-boda {
            width: 100%;
            height: 480px;
            object-fit: cover;
            border-radius: 2px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 4px;
            margin: 25px 0 10px 0;
        }

        .frase-amor {
            font-size: 1.2rem;
            font-style: italic;
            color: var(--texto-secundario);
            padding: 0 20px;
            line-height: 1.6;
        }

        /* CONTROLES FLOTANTES */
        .boton-musica {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 45px;
            height: 45px;
            background: #FFFFFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            z-index: 200;
            color: var(--texto-oscuro);
            transition: transform 0.3s;
        }

        .boton-musica:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body>

    <!-- REPRODUCTOR DE AUDIO (Se activa con tu archivo de Google Drive configurado en modo descarga directa) -->
    <audio id="musicaFondo" loop src="https://docs.google.com/uc?export=download&id=1xkem7zhA0DQPEdz5gSJDbYaxtuSJctUC"></audio>
    
    <div class="boton-musica" onclick="controlarMusica()">
        <i id="iconoMusica" class="fas fa-music"></i>
    </div>

    <div class="contenedor-movil">

        <!-- VISTA INTERACTIVA DEL SOBRE -->
        <div class="seccion-sobre" id="pantallaSobre">
            <div class="sobre-wrapper" id="sobreWrapper">
                
                <!-- Solapa del sobre -->
                <div class="sobre-solapa"></div>
                
                <!-- Sello físico -->
                <div class="sello" onclick="iniciarAnimacion()"></div>
                
                <!-- Tarjeta que resbala hacia arriba -->
                <div class="tarjeta-interior">
                    <p class="encabezado-tarjeta">Nuestra Boda</p>
                    
                    <!-- Monograma RP -->
                    <div class="monograma-marco">
                        <div class="monograma-texto">R<span>P</span></div>
                    </div>

                    <div>
                        <p class="sub-tarjeta">Invitación reservada para:</p>
                        <h3 class="invitado-nombre" id="nombreInvitado">Familia Martínez</h3>
                        <p class="invitado-pases" id="pasesInvitado">2 pases</p>
                    </div>

                    <button class="btn-abrir-invitacion" onclick="retirarSobre()">Abrir Invitación</button>
                </div>

                <!-- Cuerpo contenedor frontal -->
                <div class="sobre-cuerpo"></div>

            </div>
        </div>

        <!-- CONTENIDO DETALLADO DE LA INVITACIÓN -->
        <div class="contenido-principal" id="contenidoPrincipal">
            
            <div class="seccion">
                <!-- Imagen de Portada conectada mediante visor de Google Drive -->
                <img src="https://lh3.googleusercontent.com/d/1xkem7zhA0DQPEdz5gSJDbYaxtuSJctUC" class="foto-boda" alt="Rebeca y Pablo">
                <h1>REBECA & PABLO</h1>
                <p class="frase-amor">"A veces lo que empieza como una locura, se convierte en lo mejor de tu vida."</p>
            </div>

            <!-- Puedes ir agregando el resto de las secciones aquí debajo de la misma forma -->

        </div>

    </div>

    <script>
        // Lógica de parámetros dinámicos por URL
        const parametros = new URLSearchParams(window.location.search);
        if(parametros.get('n')) document.getElementById('nombreInvitado').innerText = parametros.get('n');
        if(parametros.get('p')) document.getElementById('pasesInvitado').innerText = parametros.get('p') + " personas";

        const sobre = document.getElementById('sobreWrapper');
        const pantallaSobre = document.getElementById('pantallaSobre');
        const contenido = document.getElementById('contenidoPrincipal');
        const audio = document.getElementById('musicaFondo');
        const icono = document.getElementById('iconoMusica');

        // Paso 1: Abrir la solapa y subir la tarjeta
        function iniciarAnimacion() {
            sobre.classList.add('abierto');
            // Intentar reproducir música automáticamente tras la primera interacción física
            audio.play().then(() => {
                icono.className = "fas fa-pause";
            }).catch(() => console.log("Permiso de reproducción en espera."));
        }

        // Paso 2: Desvanecer todo el sobre y mostrar el contenido inferior
        function retirarSobre() {
            // Asegura que la solapa esté abierta por si presionan directo el botón
            sobre.classList.add('abierto'); 
            
            setTimeout(() => {
                pantallaSobre.classList.add('desvanecido');
                contenido.style.opacity = '1';
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 400);
        }

        // Control Manual del reproductor de audio flotante
        function controlarMusica() {
            if (audio.paused) {
                audio.play();
                icono.className = "fas fa-pause";
            } else {
                audio.pause();
                icono.className = "fas fa-music";
            }
        }
    </script>
</body>
</html>
